<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>S&P 500 漲跌家數</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header><div><p class="eyebrow">MARKET BREADTH</p><h1>S&P 500 漲跌家數</h1></div><span id="badge">讀取中</span></header>
    <nav style="margin:0 0 12px;display:flex;gap:8px;flex-wrap:wrap"><a href="mcclellan.html" style="display:inline-block;font-size:13px;color:inherit;opacity:.8;text-decoration:none;padding:4px 12px;border-radius:999px;border:1px solid currentColor">廣度動能 →</a><a href="pce.html" style="display:inline-block;font-size:13px;color:inherit;opacity:.8;text-decoration:none;padding:4px 12px;border-radius:999px;border:1px solid currentColor">PCE 通膨 →</a></nav>
    <section class="hero card">
      <p id="session">—</p>
      <div class="score"><strong id="upPct">—</strong><span>上漲比例</span></div>
      <div class="bar"><i id="upBar"></i></div>
      <div class="counts"><span class="up">▲ <b id="up">—</b> 上漲</span><span class="flat">— <b id="flat">—</b> 平盤</span><span class="down">▼ <b id="down">—</b> 下跌</span></div>
    </section>
    <div class="actions">
      <button id="refreshBtn" type="button"><span class="ico" aria-hidden="true">↻</span><span id="refreshTxt">重新整理</span></button>
      <a id="runLink" target="_blank" rel="noopener" hidden>重新計算最新數據 ↗</a>
    </div>
    <p id="refreshNote" class="refresh-note" hidden>「重新計算」會到 GitHub 執行一次更新（需登入），約 2 分鐘算完；之後回來按「重新整理」就會看到新數字。</p>
    <section class="card chart-card">
      <div class="section-title"><div><h2 id="chartTitle">過去兩年收盤走勢</h2><p>每日 S&amp;P 500 成分股上漲比例</p></div><span>0–100%</span></div>
      <div class="ranges" role="group" aria-label="線圖期間"><button data-days="31">1月</button><button data-days="93">3月</button><button data-days="186">6月</button><button data-days="366">1年</button><button class="active" data-days="731">2年</button></div>
      <div class="chart-wrap"><canvas id="chart" height="300"></canvas><div id="tooltip" class="tooltip" hidden></div></div>
      <div class="legend"><i></i><span>上漲家數比例</span><em>50% 多空分界</em></div>
    </section>
    <p id="updated" class="updated">等待資料…</p>
    <p class="note">盤中數值以當下最新價相對前一交易日收盤計算，屬暫定資料；收盤後會更新為正式值。</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
