name: Update S&P 500 breadth

on:
  workflow_dispatch:
  push:                          # 程式或排程設定有改動時立刻跑一次
    branches: [main]
    paths:
      - indicators/sp500_updown.py
      - .github/workflows/update.yml
  schedule:
    # 盤中每 15 分鐘（UTC 13:00–21:45，同時涵蓋美國夏令與冬令的開盤時段，收盤後也會跑到正式值）
    - cron: "2,17,32,47 13-21 * * 1-5"

concurrency:
  group: sp500-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python indicators/sp500_updown.py
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet && exit 0
          git commit -m "data: update S&P 500 breadth"
          git pull --rebase
          git push
