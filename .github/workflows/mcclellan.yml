name: 更新 McClellan 廣度動能

on:
  schedule:
    # 美股收盤後一次：UTC 22:15 = 台灣 06:15（夏令、冬令都已收盤）
    - cron: "15 22 * * 1-5"
  workflow_dispatch:
  workflow_run:                  # 備援：漲跌家數更新完成後接著跑（GitHub 自己的排程常延遲或漏跑）
    workflows: ["Update S&P 500 breadth"]
    types: [completed]
  push:                          # 程式或排程設定有改動時立刻跑一次
    branches: [main]
    paths:
      - indicators/mcclellan.py
      - .github/workflows/mcclellan.yml

permissions:
  contents: write

concurrency:
  group: sp500-data-update       # 與其他更新共用，避免同時推送衝突
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # 第一次要抓約 6,000 檔股票 3 年的價格
    steps:
      - uses: actions/checkout@v4
      - name: 只在收盤後跑（盤中由漲跌家數觸發時跳過）
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then echo "go=1" >> $GITHUB_OUTPUT; exit 0; fi
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json, pathlib
          latest = json.loads(pathlib.Path("docs/data/latest.json").read_text())
          mc = json.loads(pathlib.Path("docs/data/mcclellan.json").read_text()) if pathlib.Path("docs/data/mcclellan.json").exists() else {}
          done = any(p["d"] == latest["session"] for p in mc.get("markets", {}).get("sp500", {}).get("series", [])[-1:]) and mc.get("closed_session") == latest["session"]
          print("go=" + ("1" if latest.get("status") == "closed" and not done else "0"))
          PY
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.go == '1'
      - run: python indicators/mcclellan.py
        if: steps.gate.outputs.go == '1'
      - name: Commit changed data
        if: always() && steps.gate.outputs.go == '1'             # 某個市場失敗時，其他市場的結果照樣存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet && exit 0
          git commit -m "data: update McClellan breadth"
          git pull --rebase
          git push
